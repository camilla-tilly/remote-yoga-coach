# Pins the production build in version control so it cannot drift in the
# Netlify UI. `npm run build` is the FULL build: RSS, then vite build, then the
# prerender step. `build:spa` is vite only and ships an app shell with no
# per-page titles, meta or JSON-LD, which is invisible to social scrapers and
# badly handicaps indexing. Production must always run `npm run build`.
[build]
  command = "npm run build"
  publish = "dist"

  # Build-credit saver. This team is on the Netlify free plan and has already
  # exhausted its monthly allowance once, which silently paused production
  # deploys for about a week.
  #
  # Two of the three weekly routines only write markdown the website never
  # renders: `content/linkedin/` (post drafts Camilla copies out by hand) and
  # `reports/` (the weekly SEO reports). Rebuilding the whole site for those,
  # including prerendering every route in headless Chrome, spends a build for no
  # change to a single published page.
  #
  # Netlify's contract here is inverted: exit 0 CANCELS the build, non-zero runs
  # it. So this asks "is there any change outside reports/ and content/?" and
  # cancels when the answer is no. If CACHED_COMMIT_REF is unset, as on a first
  # or manually triggered build, git errors, exits non-zero, and the build runs,
  # which is the safe direction to fail.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)reports' ':(exclude)content'"

[build.environment]
  NODE_VERSION = "20"
  # Puppeteer needs a real Chrome to prerender. Without this it resolves to a
  # cache path that does not survive the build image and prerendering silently
  # does nothing.
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"

# No deploy previews. The routines push straight to main and nothing opens pull
# requests any more, so a preview build is a full site build, prerendering
# included, for a copy of the site nobody opens. It also produced a netlify[bot]
# notification email on every draft PR.
#
# `exit 0` cancels the build, so it shows as skipped rather than failed. Delete
# this block if pull request previews are ever wanted again.
[context.deploy-preview]
  ignore = "exit 0"
